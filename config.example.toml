# shmooz configuration — complete reference.
#
# Install to:	$XDG_CONFIG_HOME/shmooz/config.toml  (fallback: $HOME/.config/shmooz/config.toml)
# Run with --help for controls and option help; values are strict TOML, one key per line.
#
# Each keybinding value is a key name (or an array of names). Names follow the
# lowercase evdev/xkb naming that libinput reports: letters "a", punctuation
# "=" "-" "[" "]" ";" ",", digits "1".."0" as words ("minus" for key labels
# are fine too, e.g. both quote forms below work):
#   single quote: "'" / "apostrophe"; space = "space"; arrows up/down/left/right; F1-F12;
#   numpad "kpadd", "kp0", "kpenter"; modifiers cannot be bound alone? reserved see end.
# An empty array disables a binding entirely: reset_view = [].

# Built-in keymap preset selectable also interactively on first run:
# qwerty (classic v0.3) or dvorak (left-half ortho preset, built-in default).
layout = "dvorak"
scroll_direction = "down"  # wheel rotation that zooms in: down | up

[keybindings]
close                    = "esc"      # right click is always exit; Esc default here
zoom_in                  = ["=", "kpadd"]
zoom_out                 = ["-", "kpsubtract"]
pan_left                 = "left"
pan_right                = "right"
pan_up                   = "up"
pan_down                 = "down"
reset_view               = ["0", "kp0"]   # restore/unzoom (double click too)
save_screenshot          = "s"
toggle_spotlight         = "f"            # dim screen outside pointer circle
toggle_color_picker      = "i"            # click to copy hex color
toggle_annotate_zoomed   = "d"            # draw while zoomed
toggle_annotate_unzoomed = "w"            # draw without zooming

tool_pen                 = "p"
tool_highlighter         = "h"
tool_line                = "l"
tool_rectangle           = "r"
tool_ellipse             = "e"
tool_move                = "m"   # move existing annotations (left drag)
tool_text                = "t"   # click to place text; Enter commits

undo_annotation          = "u"
clear_annotations        = "c"

# annotation color palette and text size use reserved digits 1-0 minus/=/ [ / ]
# while in any draw mode. increase/decrease_size:
increase_size            = "\\"
decrease_size            = "/"

# --- example: Dvorak on an ortho left-half (glovesora-style) -----------------
# close = ["'", "esc"]
# pan_left = "j"; pan_right = "k"; pan_up = "u"; pan_down = "x"  (split to lines)
# zoom_in = "p"   plus key prints on this layout;  zoom_out = ","  comma-minus
# reset_view = "."  zero/origin; save_screenshot = "y" yes; spotlight = "space"
# color picker = ";" ; annotate draw e / unzoomed a ; undo o oops; clear i.
